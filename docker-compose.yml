version: '3.8'

services:
  api:
    build:
      context: ./apps/api
    container_name: support_api
    env_file:
      - .env
    environment:
      DB_PATH: /data/support.db
    ports:
      - "8000:8000"
    volumes:
      - api_data:/data

  bot:
    build:
      context: ./apps/bot
    container_name: support_bot
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

  miniapp:
    build:
      context: ./apps/miniapp
    container_name: support_miniapp
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  api_data:
