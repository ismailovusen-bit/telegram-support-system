<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Панель Оператора</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { display: flex; height: 100vh; background: #0f172a; color: white; }
        #sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; padding: 15px; display: flex; flex-direction: column; }
        #chat-area { flex: 1; display: flex; flex-direction: column; padding: 20px; background: #0f172a; }

        .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
        .tab { flex: 1; padding: 8px 4px; text-align: center; border-radius: 6px; background: #334155; cursor: pointer; font-size: 12px; }
        .tab.active { background: #2563eb; font-weight: bold; }

        #chat-list { flex: 1; overflow-y: auto; }
        .chat-card { padding: 12px; background: #334155; margin-bottom: 8px; border-radius: 8px; cursor: pointer; }
        .chat-card.active { outline: 2px solid #2563eb; }
        .chat-card .meta { font-size: 11px; color: #94a3b8; margin-top: 4px; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-right: 4px; }
        .badge.open { background: #16a34a; }
        .badge.in_progress { background: #ca8a04; }
        .badge.closed { background: #64748b; }

        #messages { flex: 1; background: #1e293b; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 70%; padding: 10px 14px; border-radius: 8px; line-height: 1.4; }
        .msg.user { background: #334155; align-self: flex-start; }
        .msg.operator { background: #2563eb; align-self: flex-end; }

        .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
        .toolbar button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; color: white; }
        .btn-claim { background: #16a34a; }
        .btn-release { background: #ca8a04; }
        .btn-close { background: #dc2626; }

        .input-box { display: flex; gap: 10px; }
        input[type=text] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
        .input-box button { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .notice { padding: 12px; background: #334155; border-radius: 8px; font-size: 13px; color: #cbd5e1; }
        #access-screen { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; text-align: center; padding: 20px; }
        #access-screen input { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; width: 220px; }
        #access-screen button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app" style="display:none; width:100%; display:flex;">
        <div id="sidebar">
            <h3 style="margin-bottom: 15px;">Входящие чаты</h3>
            <div class="tabs">
                <div class="tab active" data-status="open">Открытые</div>
                <div class="tab" data-status="in_progress">В работе</div>
                <div class="tab" data-status="closed">Закрытые</div>
            </div>
            <div id="chat-list">Загрузка...</div>
        </div>
        <div id="chat-area">
            <h3 id="chat-header" style="margin-bottom: 15px;">Выберите чат из списка</h3>
            <div id="toolbar" class="toolbar"></div>
            <div id="messages"></div>
            <div id="input-area"></div>
        </div>
    </div>

    <div id="access-screen">
        <div>Не удалось подтвердить оператора.</div>
        <div id="access-detail" class="notice" style="display:none;"></div>
    </div>

    <script>
        // Адрес API. При необходимости поменяйте на свой Render-URL.
        const API = "https://telegram-support-api.onrender.com";

        let currentChatId = null;
        let currentStatus = "open";
        let myOperatorId = null;
        let authHeaderValue = null;
        let accessDenied = false;

        function initAuth() {
            const tg = window.Telegram && window.Telegram.WebApp;
            if (tg && tg.initData) {
                tg.ready();
                tg.expand();
                authHeaderValue = tg.initData;
                myOperatorId = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
                return true;
            }

            // Не открыто внутри Telegram — режим для локальной разработки/тестирования.
            // Работает только если на API включён DEV_MODE=1 и ваш id есть в OPERATOR_IDS.
            let devId = localStorage.getItem("dev_operator_id");
            if (!devId) {
                devId = prompt("Не в Telegram. Введите ваш Telegram ID для DEV-режима (нужен DEV_MODE=1 на API):");
                if (devId) localStorage.setItem("dev_operator_id", devId);
            }
            if (!devId) return false;
            authHeaderValue = `dev:${devId}`;
            myOperatorId = parseInt(devId, 10);
            return true;
        }

        function authHeaders() {
            return { "X-Telegram-Init-Data": authHeaderValue };
        }

        async function apiFetch(path, options = {}) {
            const res = await fetch(`${API}${path}`, {
                ...options,
                headers: { ...(options.headers || {}), ...authHeaders() },
            });
            if (res.status === 401 || res.status === 403) {
                accessDenied = true;
                const body = await res.json().catch(() => ({}));
                showAccessDenied(body.detail || "Доступ запрещён");
                throw new Error("access_denied");
            }
            return res;
        }

        function showAccessDenied(detail) {
            document.getElementById("app").style.display = "none";
            document.getElementById("access-screen").style.display = "flex";
            const d = document.getElementById("access-detail");
            d.style.display = "block";
            d.innerText = detail;
        }

        function statusLabel(status) {
            return { open: "Открыт", in_progress: "В работе", closed: "Закрыт" }[status] || status;
        }

        async function fetchChats() {
            if (accessDenied) return;
            try {
                const res = await apiFetch(`/chats?status=${currentStatus}`);
                const chats = await res.json();
                const container = document.getElementById("chat-list");
                container.innerHTML = "";

                if (chats.length === 0) {
                    container.innerHTML = '<div class="notice">Нет чатов в этой категории</div>';
                }

                chats.forEach((c) => {
                    const div = document.createElement("div");
                    div.className = `chat-card ${currentChatId === c.chat_id ? "active" : ""}`;
                    const ownerNote = c.status === "in_progress" ? (c.is_mine ? " (у меня)" : " (у другого оператора)") : "";
                    div.innerHTML = `<div><span class="badge ${c.status}">${statusLabel(c.status)}</span>Чат #${c.chat_id}${ownerNote}</div><div class="meta">${(c.last_msg || "").slice(0, 60)}</div>`;
                    div.onclick = () => selectChat(c.chat_id, c.status, c.is_mine);
                    container.appendChild(div);
                });
            } catch (e) {
                // access_denied уже обработан в apiFetch
            }
        }

        async function selectChat(id, status, isMine) {
            currentChatId = id;
            document.getElementById("chat-header").innerText = `Диалог с пользователем #${id}`;
            renderToolbar(status, isMine);
            renderInput(status, isMine);
            await loadMessages();
            await fetchChats();
        }

        function renderToolbar(status, isMine) {
            const toolbar = document.getElementById("toolbar");
            toolbar.innerHTML = "";
            if (status === "open") {
                const btn = document.createElement("button");
                btn.className = "btn-claim";
                btn.innerText = "Взять в работу";
                btn.onclick = claimCurrentChat;
                toolbar.appendChild(btn);
            } else if (status === "in_progress" && isMine) {
                const release = document.createElement("button");
                release.className = "btn-release";
                release.innerText = "Вернуть в очередь";
                release.onclick = releaseCurrentChat;
                toolbar.appendChild(release);

                const close = document.createElement("button");
                close.className = "btn-close";
                close.innerText = "Закрыть чат";
                close.onclick = closeCurrentChat;
                toolbar.appendChild(close);
            }
        }

        function renderInput(status, isMine) {
            const box = document.getElementById("input-area");
            if (status === "in_progress" && isMine) {
                box.innerHTML = `
                    <div class="input-box">
                        <input type="text" id="msg-input" placeholder="Напишите ответ клиенту в Telegram...">
                        <button onclick="sendReply()">Отправить</button>
                    </div>`;
            } else if (status === "open") {
                box.innerHTML = '<div class="notice">Возьмите чат в работу, чтобы отвечать.</div>';
            } else if (status === "in_progress" && !isMine) {
                box.innerHTML = '<div class="notice">Чат занят другим оператором. Только просмотр.</div>';
            } else {
                box.innerHTML = '<div class="notice">Чат закрыт.</div>';
            }
        }

        async function loadMessages() {
            if (!currentChatId) return;
            try {
                const res = await apiFetch(`/chats/${currentChatId}/messages`);
                const msgs = await res.json();
                const box = document.getElementById("messages");
                box.innerHTML = "";
                msgs.forEach((m) => {
                    const div = document.createElement("div");
                    div.className = `msg ${m.sender_type}`;
                    div.innerText = m.text;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            } catch (e) {}
        }

        async function claimCurrentChat() {
            if (!currentChatId) return;
            const res = await fetch(`${API}/chats/${currentChatId}/claim`, { method: "POST", headers: authHeaders() });
            if (res.status === 409) {
                alert("Этот чат уже взял в работу другой оператор.");
            }
            await fetchChats();
            await refreshCurrentSelection();
        }

        async function releaseCurrentChat() {
            if (!currentChatId) return;
            await fetch(`${API}/chats/${currentChatId}/release`, { method: "POST", headers: authHeaders() });
            currentChatId = null;
            document.getElementById("chat-header").innerText = "Выберите чат из списка";
            document.getElementById("toolbar").innerHTML = "";
            document.getElementById("input-area").innerHTML = "";
            document.getElementById("messages").innerHTML = "";
            await fetchChats();
        }

        async function closeCurrentChat() {
            if (!currentChatId) return;
            await fetch(`${API}/chats/${currentChatId}/close`, { method: "POST", headers: authHeaders() });
            currentChatId = null;
            document.getElementById("chat-header").innerText = "Выберите чат из списка";
            document.getElementById("toolbar").innerHTML = "";
            document.getElementById("input-area").innerHTML = "";
            document.getElementById("messages").innerHTML = "";
            await fetchChats();
        }

        async function refreshCurrentSelection() {
            if (!currentChatId) return;
            const res = await apiFetch(`/chats?status=in_progress`);
            const chats = await res.json();
            const chat = chats.find((c) => c.chat_id === currentChatId);
            if (chat) {
                renderToolbar(chat.status, chat.is_mine);
                renderInput(chat.status, chat.is_mine);
            }
        }

        async function sendReply() {
            const input = document.getElementById("msg-input");
            if (!input || !input.value || !currentChatId) return;
            const res = await fetch(`${API}/chats/${currentChatId}/messages`, {
                method: "POST",
                headers: { ...authHeaders(), "Content-Type": "application/json" },
                body: JSON.stringify({ text: input.value }),
            });
            if (res.status === 403 || res.status === 409) {
                const body = await res.json();
                alert(body.detail);
            }
            input.value = "";
            await loadMessages();
        }

        document.querySelectorAll(".tab").forEach((tab) => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
                tab.classList.add("active");
                currentStatus = tab.dataset.status;
                fetchChats();
            });
        });

        async function bootstrap() {
            const ok = initAuth();
            if (!ok) {
                showAccessDenied("Не удалось определить оператора");
                return;
            }
            document.getElementById("app").style.display = "flex";
            document.getElementById("access-screen").style.display = "none";
            await fetchChats();
            setInterval(() => {
                fetchChats();
                loadMessages();
            }, 3000);
        }

        bootstrap();
    </script>
</body>
</html>
